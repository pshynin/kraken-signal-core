name: Scanner

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours at :00 UTC (00, 06, 12, 18)

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without DB writes or Discord alerts (--dry-run)"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        type: choice
        options:
          - production
          - staging
        default: production

# ── Concurrency ───────────────────────────────────────────────────────────────
# A scan run must complete fully before the next starts.
# cancel-in-progress: false → queue, never cancel a running scan (DB consistency).
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    name: Scanner Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/scanner

      - name: Run scanner
        working-directory: apps/scanner
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m scanner.main $ARGS
        env:
          SCANNER_ENV: ${{ github.event.inputs.environment || 'production' }}
          SCANNER_TRIGGERED_BY: >-
            ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          SCANNER_VERSION: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_CLEAN: ${{ secrets.DISCORD_WEBHOOK_CLEAN }}
          DISCORD_WEBHOOK_UGLY: ${{ secrets.DISCORD_WEBHOOK_UGLY }}
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}

      - name: Write job summary
        if: always()
        working-directory: apps/scanner
        run: |
          if [ -f scan_summary.json ]; then
            python - <<'EOF'
          import json, os
          with open("scan_summary.json") as f:
              s = json.load(f)
          lines = [
              "## Scanner Run Summary",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Status | {s.get('status', '—')} |",
              f"| Dry run | {s.get('dry_run', False)} |",
              f"| Assets scanned | {s.get('assets_scanned', '—')} |",
              f"| Passed filter | {s.get('assets_passed_filter', '—')} |",
              f"| Clean candidates | {s.get('candidates_clean', 0)} |",
              f"| Ugly candidates | {s.get('candidates_ugly', 0)} |",
              f"| Alerts sent | {s.get('alerts_sent', 0)} |",
              f"| Scan run ID | `{s.get('scan_run_id', '—')}` |",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
          EOF
          else
            echo "## Scanner Run" >> $GITHUB_STEP_SUMMARY
            echo "Run did not produce a summary (failed before completion)." >> $GITHUB_STEP_SUMMARY
          fi
