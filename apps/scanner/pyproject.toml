[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kraken-signal-scanner"
version = "0.1.0"
description = "Crypto Momentum Alert Copilot — Scanner Service"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
  "N803",  # argument name should be lowercase (allow df, ATR etc.)
  "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["scanner"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
markers = [
    "integration: marks tests that require live Supabase + Kraken access (deselect with -m 'not integration')",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["scanner"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
