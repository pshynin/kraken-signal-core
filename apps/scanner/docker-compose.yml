# Crypto Momentum Alert Copilot — Scanner
#
# One-shot run (mirrors GitHub Actions schedule):
#   docker compose run --rm scanner
#
# Dry-run (no DB writes, no Discord alerts):
#   docker compose run --rm scanner --dry-run
#
# Rebuild after code changes:
#   docker compose build

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: kraken-scanner:local
    env_file: .env           # copy .env.example → .env and fill in secrets
    environment:
      # Disable numba JIT — the scanner does not need JIT acceleration, and
      # leaving it on makes pandas_ta fail at import time in Docker
      # ("RuntimeError: cannot cache function 'fibonacci': no locator
      # available"). NUMBA_CACHE_DIR is a writable-dir fallback.
      NUMBA_DISABLE_JIT: "1"
      NUMBA_CACHE_DIR: /tmp/numba_cache
    restart: "no"            # one-shot job — not a long-running service
    network_mode: bridge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
